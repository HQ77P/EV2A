<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>我的展示页面</title>
    <style>
        body {
            font-family: Arial;
            margin: 40px;
            background: #f5f5f5;
        }
        h1 {
            color: #333;
        }
        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        img {
            max-width: 100%;
            border-radius: 10px;
        }
        pre {
            background: #272822;
            color: #f8f8f2;
            padding: 15px;
            overflow-x: auto;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<h1>我的多媒体展示网页</h1>

<div class="card">
    <h2>图片展示</h2>
    <img src="images/test.jpg" alt="示例图片">
</div>

<div class="card">
    <h2>音频播放</h2>
    <audio controls>
        <source src="audio/test.mp3" type="audio/mpeg">
        你的浏览器不支持音频播放
    </audio>
</div>

<div class="card">
    <h2>代码展示</h2>
    <pre><code>
def hello():
    print("Hello GitHub Pages!")
    </code></pre>
</div>

</body>
</html>
